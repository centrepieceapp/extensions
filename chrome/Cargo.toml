[package]
name = "centrepiece-chrome"
version = "0.1.0"
edition = "2024"
description = "A Centrepiece extension: search Chrome bookmarks, and open the copied URL in a Chrome profile"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
centrepiece-extension.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
