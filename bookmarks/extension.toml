# Browser bookmarks: pick a browser, then a profile, then a bookmark. The
# manifest names every browser it looks for, where it keeps its bookmarks, and
# the binary that opens a page in it.
id = "bookmarks"
name = "Browser Bookmarks"
description = "Browse bookmarks by browser and profile"
prefix = "bb"
icon = "builtin:bookmark"
api = "0.6"

[permissions]
# Which browsers are installed: their bundles, in either Applications folder.
# Where each keeps its profiles and bookmarks.
read = [
    "/Applications/Google Chrome.app",
    "~/Applications/Google Chrome.app",
    "/Applications/Google Chrome Beta.app",
    "~/Applications/Google Chrome Beta.app",
    "/Applications/Google Chrome Canary.app",
    "~/Applications/Google Chrome Canary.app",
    "/Applications/Chromium.app",
    "~/Applications/Chromium.app",
    "/Applications/Brave Browser.app",
    "~/Applications/Brave Browser.app",
    "/Applications/Microsoft Edge.app",
    "~/Applications/Microsoft Edge.app",
    "/Applications/Vivaldi.app",
    "~/Applications/Vivaldi.app",
    "/Applications/Opera.app",
    "~/Applications/Opera.app",
    "/Applications/Helium.app",
    "~/Applications/Helium.app",
    "/Applications/Firefox.app",
    "~/Applications/Firefox.app",
    "/Applications/Zen.app",
    "~/Applications/Zen.app",
    "/Applications/LibreWolf.app",
    "~/Applications/LibreWolf.app",
    "/Applications/Safari.app",
    "~/Library/Application Support/Google",
    "~/Library/Application Support/Chromium",
    "~/Library/Application Support/BraveSoftware",
    "~/Library/Application Support/Microsoft Edge",
    "~/Library/Application Support/Vivaldi",
    "~/Library/Application Support/com.operasoftware.Opera",
    "~/Library/Application Support/net.imput.helium",
    "~/Library/Application Support/Firefox",
    "~/Library/Application Support/zen",
    "~/Library/Application Support/librewolf",
    # Only with Full Disk Access granted to Centrepiece.
    "~/Library/Safari",
]
# Each browser's own binary, which opens a page in a named profile whether or
# not the browser is already running; `open -a` for Safari, and as a fallback;
# and sqlite3, which reads the Firefox family's bookmark database.
run = [
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome",
    "~/Applications/Google Chrome.app/Contents/MacOS/Google Chrome",
    "/Applications/Google Chrome Beta.app/Contents/MacOS/Google Chrome Beta",
    "~/Applications/Google Chrome Beta.app/Contents/MacOS/Google Chrome Beta",
    "/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary",
    "~/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary",
    "/Applications/Chromium.app/Contents/MacOS/Chromium",
    "~/Applications/Chromium.app/Contents/MacOS/Chromium",
    "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser",
    "~/Applications/Brave Browser.app/Contents/MacOS/Brave Browser",
    "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge",
    "~/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge",
    "/Applications/Vivaldi.app/Contents/MacOS/Vivaldi",
    "~/Applications/Vivaldi.app/Contents/MacOS/Vivaldi",
    "/Applications/Opera.app/Contents/MacOS/Opera",
    "~/Applications/Opera.app/Contents/MacOS/Opera",
    "/Applications/Helium.app/Contents/MacOS/Helium",
    "~/Applications/Helium.app/Contents/MacOS/Helium",
    "/Applications/Firefox.app/Contents/MacOS/firefox",
    "~/Applications/Firefox.app/Contents/MacOS/firefox",
    "/Applications/Zen.app/Contents/MacOS/zen",
    "~/Applications/Zen.app/Contents/MacOS/zen",
    "/Applications/LibreWolf.app/Contents/MacOS/librewolf",
    "~/Applications/LibreWolf.app/Contents/MacOS/librewolf",
    "/usr/bin/open",
    "/usr/bin/sqlite3",
]
# The default browser, when the chosen one will not start.
open = true
